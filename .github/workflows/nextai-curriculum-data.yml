name: Build NextAI curriculum corpus

on:
  push:
    branches: [nextai-operator-foundation, nextai-deep-training]
    paths:
      - ".github/workflows/nextai-curriculum-data.yml"
      - "training/nextai/capability_census.py"
      - "training/nextai/prepare_public_corpora.py"
      - "training/nextai/train_nextai.py"
      - "training/nextai/audit_nextai_corpus.py"
      - "training/nextai/build_capability_curriculum.py"
      - "tests/next-ai/test_public_corpus_preparation.py"
      - "tests/next-ai/test_capability_curriculum_materialization.py"
      - "tests/next-ai/test_capability_census.py"
      - "docs/next-ai/catalogs/**"
      - "adapters/nextcad-ai/NextAI/knowledge_packs/skills/**"
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "Optional completed Native application builds run ID"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nextai-curriculum-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build and audit the real NextAI curriculum
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout pinned project curriculum
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only corpus preparation dependencies
        run: python -m pip install --disable-pip-version-check datasets pillow

      - name: Run curriculum loader and split-integrity regression tests
        run: python -m unittest discover -s tests/next-ai -p 'test_public_corpus_preparation.py' -v

      - name: Find validated native capability and execution artifacts, when available
        id: native_census
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          run_id="$REQUESTED_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list \
              --workflow .github/workflows/native-application-build.yml \
              --branch "$GITHUB_REF_NAME" --limit 30 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))][0].databaseId // ""')"
          fi
          runtime_report=""
          nextcad_native_dir=""
          nextbim_native_dir=""
          if [[ -n "$run_id" ]]; then
            echo "Checking native workflow run $run_id for version-pinned census and validated L3/L4 split artifacts."
            for artifact in nextcad-windows-capability-census nextcad-macos-capability-census nextcad-linux-gui-evidence; do
              target="$RUNNER_TEMP/native-evidence/$artifact"
              mkdir -p "$target"
              if gh run download "$run_id" --name "$artifact" --dir "$target"; then
                candidate="$(find "$target" -type f -name 'nextcad-runtime.json' -print -quit)"
                if [[ -n "$candidate" ]]; then
                  runtime_report="$candidate"
                  break
                fi
              fi
            done
            for app in nextcad nextbim; do
              artifact="${app}-native-training-corpus"
              target="$RUNNER_TEMP/native-evidence/$artifact"
              mkdir -p "$target"
              if gh run download "$run_id" --name "$artifact" --dir "$target"; then
                if [[ -f "$target/manifest.json" && -f "$target/sft/train.jsonl" && -f "$target/sft/validation.jsonl" && -f "$target/sft/test.jsonl" ]]; then
                  if python - "$target/manifest.json" "$app" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          app = sys.argv[2]
          expected = "nextcad" if app == "nextcad" else "nextbim"
          summary = manifest.get("sft_summary") or {}
          expected_counts = {"train": 2, "validation": 2, "test": 2}
          observed = {key: int(summary.get(key, 0)) for key in expected_counts}
          app_valid = manifest.get("application") == expected
          schema_valid = manifest.get("schema_version") == f"{expected}.native-trace-corpus.v1"
          lineage_valid = bool(
              manifest.get("train_validation_test_source_lineages_are_disjoint")
              or manifest.get("source_lineages_disjoint")
          )
          splits_valid = observed == expected_counts and summary.get("quarantine", 0) == 0 and summary.get("source_groups_with_split_leakage", 0) == 0
          raise SystemExit(0 if app_valid and schema_valid and lineage_valid and splits_valid else 1)
          PY
                  then
                    if [[ "$app" == "nextcad" ]]; then nextcad_native_dir="$target"; else nextbim_native_dir="$target"; fi
                    echo "$app native split artifact validated."
                  else
                    echo "$app native artifact failed manifest/SFT split validation; it will not be merged."
                  fi
                else
                  echo "$app native artifact is partial or missing a manifest; it will not be merged."
                fi
              fi
            done
          fi
          echo "runtime_report=$runtime_report" >> "$GITHUB_OUTPUT"
          echo "nextcad_native_dir=$nextcad_native_dir" >> "$GITHUB_OUTPUT"
          echo "nextbim_native_dir=$nextbim_native_dir" >> "$GITHUB_OUTPUT"
          [[ -n "$runtime_report" ]] && echo "NEXTCAD_RUNTIME_CENSUS=AVAILABLE" >> "$GITHUB_STEP_SUMMARY" || echo "NEXTCAD_RUNTIME_CENSUS=NOT CAPTURED; source-only coverage is incomplete." >> "$GITHUB_STEP_SUMMARY"
          [[ -n "$nextcad_native_dir" ]] && echo "NEXTCAD_NATIVE_SPLITS=VALIDATED" >> "$GITHUB_STEP_SUMMARY" || echo "NEXTCAD_NATIVE_SPLITS=NOT AVAILABLE OR NOT VALIDATED" >> "$GITHUB_STEP_SUMMARY"
          [[ -n "$nextbim_native_dir" ]] && echo "NEXTBIM_NATIVE_SPLITS=VALIDATED" >> "$GITHUB_STEP_SUMMARY" || echo "NEXTBIM_NATIVE_SPLITS=NOT AVAILABLE OR NOT VALIDATED" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the pinned native capability census
        shell: bash
        env:
          RUNTIME_REPORT: ${{ steps.native_census.outputs.runtime_report }}
        run: |
          set -euo pipefail
          args=(
            --bim-catalog docs/next-ai/catalogs/BIMCRAFT_NATIVE_COMMANDS.v1.json
            --nextcad-source-index docs/next-ai/catalogs/NEXTCAD_WORKBENCH_SOURCE_INDEX.v1.json
            --expected-nextcad-commit 00cb280454069966a2fb0a8e7dc184c46e7b38b3
            --expected-nextbim-commit a0c57b738e308d433ab4b8c0c93d7fff9e53bc1b
            --output-dir "$RUNNER_TEMP/nextai-capability-census"
          )
          if [[ -n "$RUNTIME_REPORT" ]]; then
            args+=(--nextcad-runtime-report "$RUNTIME_REPORT")
          fi
          python training/nextai/capability_census.py "${args[@]}"

      - name: Prepare the multimodal CAD, BIM and engineering curriculum
        env:
          NEXTCAD_NATIVE_DIR: ${{ steps.native_census.outputs.nextcad_native_dir }}
          NEXTBIM_NATIVE_DIR: ${{ steps.native_census.outputs.nextbim_native_dir }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --output-dir "$RUNNER_TEMP/nextai-corpus"
            --capability-census "$RUNNER_TEMP/nextai-capability-census/capability-census.json"
            --max-cad-train 2500
            --max-cad-validation 250
            --max-cad-test 250
            --max-bim-train 30000
            --max-bim-validation 3000
            --max-ifcqa-train 5000
            --max-ifcqa-test 1000
            --max-mixed-train 24000
            --max-validation 2500
            --max-test 1200
            --analytic-cases-per-domain 10000
          )
          if [[ -n "$NEXTCAD_NATIVE_DIR" ]]; then
            args+=(--nextcad-native-train "$NEXTCAD_NATIVE_DIR/sft/train.jsonl"
                   --nextcad-native-validation "$NEXTCAD_NATIVE_DIR/sft/validation.jsonl"
                   --nextcad-native-test "$NEXTCAD_NATIVE_DIR/sft/test.jsonl")
          fi
          if [[ -n "$NEXTBIM_NATIVE_DIR" ]]; then
            args+=(--nextbim-native-train "$NEXTBIM_NATIVE_DIR/sft/train.jsonl"
                   --nextbim-native-validation "$NEXTBIM_NATIVE_DIR/sft/validation.jsonl"
                   --nextbim-native-test "$NEXTBIM_NATIVE_DIR/sft/test.jsonl")
          fi
          python training/nextai/prepare_public_corpora.py "${args[@]}"

      - name: Validate train, validation, test and curriculum sidecar isolation
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "training/nextai")
          from train_nextai import read_jsonl, validate_training_splits

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          root = runner_temp / "nextai-corpus"
          reports = {}
          for prefix in ("", "skill_", "capability_"):
              train = read_jsonl(root / f"{prefix}train.jsonl")
              validation = read_jsonl(root / f"{prefix}validation.jsonl")
              test = read_jsonl(root / f"{prefix}test.jsonl")
              if prefix == "" and (not train or not validation or not test):
                  raise SystemExit("Main curriculum must have non-empty train, validation and held-out test splits.")
              reports[prefix or "main"] = {
                  "train": len(train),
                  "validation": len(validation),
                  "test": len(test),
                  "integrity": validate_training_splits(train, validation, test),
              }

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          census = json.loads((runner_temp / "nextai-capability-census" / "capability-census.json").read_text(encoding="utf-8"))
          profile = {
              "student": manifest["student"],
              "method": manifest["method"],
              "train_records": manifest["train_records"],
              "validation_records": manifest["validation_records"],
              "test_records": manifest["test_records"],
              "training_domain_counts": manifest["training_domain_counts"],
              "source_counts": manifest["source_counts"],
              "nextcad_runtime_capture": census["sources"]["nextcad"]["runtime_capture"],
              "nextcad_source_modules": census["counts"]["nextcad_source_modules"],
              "nextcad_runtime_commands": census["counts"]["nextcad_runtime_commands"],
              "nextcad_runtime_api_members": census["counts"]["nextcad_runtime_api_members"],
              "nextbim_registered_commands": census["counts"]["nextbim_registered_commands"],
              "capability_learning_obligations": census["counts"]["skill_obligations"],
              "capability_obligations_are_training_examples": False,
              "held_out_test_used_for_training": manifest["test_not_used_for_training"] is False,
              "splits": reports,
          }
          if manifest["test_not_used_for_training"] is not True:
              raise SystemExit("The held-out test split must remain excluded from training.")
          output = Path("nextai-corpus-profile.json")
          output.write_text(json.dumps(profile, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(profile, indent=2, ensure_ascii=False))
          PY

      - name: Install pinned Transformers for exact Qwen3.5 tokenization
        run: python -m pip install --disable-pip-version-check "transformers==5.24.1"

      - name: Audit the complete merged training corpus with the Qwen3.5 tokenizer
        run: |
          python training/nextai/audit_nextai_corpus.py \
            --data-dir "$RUNNER_TEMP/nextai-corpus" \
            --tokenizer Qwen/Qwen3.5-0.8B \
            --output "$RUNNER_TEMP/nextai-corpus/corpus_audit.json"

      - name: Publish the curriculum audit profile and tokenizer report (no raw dataset upload)
        uses: actions/upload-artifact@v4
        with:
          name: nextai-curriculum-profile
          path: |
            nextai-corpus-profile.json
            ${{ runner.temp }}/nextai-corpus/manifest.json
            ${{ runner.temp }}/nextai-capability-census/capability-census.json
            ${{ runner.temp }}/nextai-capability-census/capability-census-report.md
            ${{ runner.temp }}/nextai-corpus/corpus_audit.json
          if-no-files-found: error
          retention-days: 3
