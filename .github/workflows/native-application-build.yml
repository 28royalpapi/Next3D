name: Native application builds

on:
  push:
    branches: [main, nextcad, nextai-operator-foundation]
    paths:
      - "scripts/verify_native_capability_indices.py"
      - "scripts/run_nextcad_capability_census.py"
      - "scripts/run_nextcad_ai_acceptance.py"
      - "training/nextai/verify_nextcad_ai_native.FCMacro"
      - "training/nextai/COMPLETE_NATIVE_CAPABILITY_STANDARD.md"
      - "docs/next-ai/catalogs/**"
      - ".github/workflows/native-application-build.yml"
      - ".gitmodules"
      - "upstream/**"
      - "adapters/nextcad-ai/**"
      - "tests/next-ai/**"
      - "training/nextai/**"
      - "packaging/nextai/**"
      - "patches/**"
      - "scripts/apply-source-patches.sh"
      - "scripts/apply-nextcad-branding.py"
      - "scripts/install-nextcad-ai.py"
      - "scripts/apply-nextbim-assistant-workspace.py"
      - "scripts/install-nextbim-ai-knowledge.py"
      - "scripts/fix-nextbim-local-provider-type.py"
      - "scripts/verify-source-patches.py"
      - "scripts/verify_nextcad_roundtrip.py"
      - "scripts/verify_nextbim_roundtrip.py"
      - "scripts/smoke_native.py"
  pull_request:
    paths:
      - "scripts/verify_native_capability_indices.py"
      - "scripts/run_nextcad_capability_census.py"
      - "training/nextai/COMPLETE_NATIVE_CAPABILITY_STANDARD.md"
      - "docs/next-ai/catalogs/**"
      - ".github/workflows/native-application-build.yml"
      - ".gitmodules"
      - "upstream/**"
      - "adapters/nextcad-ai/**"
      - "tests/next-ai/**"
      - "training/nextai/**"
      - "packaging/nextai/**"
      - "scripts/install-nextcad-ai.py"
      - "scripts/apply-nextbim-assistant-workspace.py"
      - "scripts/fix-nextbim-local-provider-type.py"
      - "patches/**"
      - "scripts/apply-source-patches.sh"
      - "scripts/apply-nextcad-branding.py"
      - "scripts/verify-source-patches.py"
      - "scripts/verify_nextcad_roundtrip.py"
      - "scripts/verify_nextbim_roundtrip.py"
      - "scripts/smoke_native.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-preparation:
    name: Verify pinned sources and Next AI patches
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout all upstream sources
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Install NextAI corpus test dependency
        run: python -m pip install --disable-pip-version-check pillow shapely

      - name: Apply and verify Next 3D source changes
        shell: bash
        run: |
          echo "Preparing the two pinned native source trees; no encoded overlay patch is used."
          bash scripts/apply-source-patches.sh

      - name: Verify capability indexes against pinned native sources
        shell: bash
        run: |
          python scripts/verify_native_capability_indices.py \
            --nextcad-source-root upstream/FreeCAD/src/Mod \
            --nextbim-source-root upstream/BIMCraft \
            --nextcad-source-index docs/next-ai/catalogs/NEXTCAD_WORKBENCH_SOURCE_INDEX.v1.json \
            --nextbim-catalog docs/next-ai/catalogs/BIMCRAFT_NATIVE_COMMANDS.v1.json

      - name: Run NextAI data-pipeline unit tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -m unittest discover -s tests/next-ai -p 'test_*.py' -v
          python -m py_compile training/nextai/*.py

  nextcad:
    name: NextCAD / ${{ matrix.os }}
    needs: source-preparation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: ubuntu-24.04 }
          - { os: Windows, runner: windows-2025 }
          - { os: macOS, runner: macos-15 }
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Checkout all upstream sources
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Prepare only the pinned NextCAD source tree
        shell: bash
        run: |
          bash scripts/apply-source-patches.sh --only nextcad

      - name: Install the pinned FreeCAD build environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          working-directory: upstream/FreeCAD
          locked: true
          cache: true

      - name: Configure NextCAD
        working-directory: upstream/FreeCAD
        run: pixi run configure

      - name: Build NextCAD
        working-directory: upstream/FreeCAD
        run: pixi run build

      - name: Install NextCAD into the pinned runtime environment
        working-directory: upstream/FreeCAD
        run: pixi run install

      - name: Run FreeCAD test suite against NextCAD
        id: freecad_tests
        continue-on-error: true
        working-directory: upstream/FreeCAD
        run: pixi run test

      - name: Verify NextCAD native create-edit-save-reopen
        working-directory: upstream/FreeCAD
        run: pixi run python ../../scripts/verify_nextcad_roundtrip.py
      - name: Verify real NextAI typed operations in native FreeCAD on Windows
        if: runner.os == 'Windows'
        working-directory: upstream/FreeCAD
        run: pixi run python ../../scripts/run_nextcad_ai_acceptance.py --executable build/relWithDebInfo/bin/FreeCAD.exe --output ../../artifacts/nextcad-ai-native-acceptance.json
      - name: Upload NextCAD Windows AI native acceptance
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nextcad-windows-ai-native-acceptance
          path: artifacts/nextcad-ai-native-acceptance.*
          if-no-files-found: warn
          retention-days: 30

      - name: Launch NextCAD on Windows
        if: runner.os == 'Windows'
        working-directory: upstream/FreeCAD
        run: pixi run python ../../scripts/smoke_native.py --executable build/relWithDebInfo/bin/FreeCAD.exe

      - name: Capture live NextCAD capability census on Windows
        if: runner.os == 'Windows'
        working-directory: upstream/FreeCAD
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../artifacts | Out-Null
          pixi run python ../../scripts/run_nextcad_capability_census.py --executable build/relWithDebInfo/bin/FreeCAD.exe --macro ../../training/nextai/discover_nextcad_runtime.FCMacro --output ../../artifacts/nextcad-runtime.json --census-output ../../artifacts/capability-census --nextcad-commit 00cb280454069966a2fb0a8e7dc184c46e7b38b3 --nextbim-commit a0c57b738e308d433ab4b8c0c93d7fff9e53bc1b
      - name: Upload NextCAD Windows capability census
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nextcad-windows-capability-census
          path: |
            artifacts/nextcad-runtime.json
            artifacts/capability-census/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify real NextAI typed operations in native FreeCAD on macOS
        if: runner.os == 'macOS'
        working-directory: upstream/FreeCAD
        run: pixi run python ../../scripts/run_nextcad_ai_acceptance.py --executable build/relWithDebInfo/bin/FreeCAD --output ../../artifacts/nextcad-ai-native-acceptance.json
      - name: Upload NextCAD macOS AI native acceptance
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nextcad-macos-ai-native-acceptance
          path: artifacts/nextcad-ai-native-acceptance.*
          if-no-files-found: warn
          retention-days: 30

      - name: Launch NextCAD on macOS
        if: runner.os == 'macOS'
        working-directory: upstream/FreeCAD
        run: pixi run python ../../scripts/smoke_native.py --executable build/relWithDebInfo/bin/FreeCAD

      - name: Capture live NextCAD capability census on macOS
        if: runner.os == 'macOS'
        working-directory: upstream/FreeCAD
        run: |
          mkdir -p ../../artifacts
          pixi run python ../../scripts/run_nextcad_capability_census.py --executable build/relWithDebInfo/bin/FreeCAD --macro ../../training/nextai/discover_nextcad_runtime.FCMacro --output ../../artifacts/nextcad-runtime.json --census-output ../../artifacts/capability-census --nextcad-commit 00cb280454069966a2fb0a8e7dc184c46e7b38b3 --nextbim-commit a0c57b738e308d433ab4b8c0c93d7fff9e53bc1b
      - name: Upload NextCAD macOS capability census
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nextcad-macos-capability-census
          path: |
            artifacts/nextcad-runtime.json
            artifacts/capability-census/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify real NextAI typed operations in native FreeCAD on Linux
        if: runner.os == 'Linux'
        working-directory: upstream/FreeCAD
        run: |
          mkdir -p ../../artifacts
          xvfb-run -a -s "-screen 0 1600x1000x24" pixi run python ../../scripts/run_nextcad_ai_acceptance.py --executable build/relWithDebInfo/bin/FreeCAD --output ../../artifacts/nextcad-ai-native-acceptance.json

      - name: Capture the real NextCAD interface
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 xvfb scrot xdotool
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -lc '
            set -euo pipefail
            cd upstream/FreeCAD
            pixi run python ../../scripts/run_nextcad_capability_census.py --executable build/relWithDebInfo/bin/FreeCAD --macro ../../training/nextai/discover_nextcad_runtime.FCMacro --output ../../artifacts/nextcad-runtime.json --census-output ../../artifacts/capability-census --nextcad-commit 00cb280454069966a2fb0a8e7dc184c46e7b38b3 --nextbim-commit a0c57b738e308d433ab4b8c0c93d7fff9e53bc1b
            pixi run freecad > ../../artifacts/nextcad.log 2>&1 &
            app_pid=$!
            window_id=""
            for attempt in $(seq 1 90); do
              sleep 2
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "NextCAD exited before the screenshot could be captured" >&2
                cat ../../artifacts/nextcad.log
                exit 1
              fi
              window_id="$(xdotool search --onlyvisible --name "FreeCAD|NextCAD" 2>/dev/null | head -n 1 || true)"
              if [ -n "$window_id" ]; then
                break
              fi
            done
            if [ -z "$window_id" ]; then
              echo "NextCAD did not create a visible desktop window" >&2
              cat ../../artifacts/nextcad.log
              kill "$app_pid" || true
              exit 1
            fi
            xdotool windowactivate --sync "$window_id" || true
            sleep 5
            scrot ../../artifacts/nextcad.png
            kill "$app_pid" || true
            wait "$app_pid" || true
            test -s ../../artifacts/nextcad.png
          '

      - name: Upload NextCAD GUI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nextcad-linux-gui-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve NextCAD unit-test gate after native acceptance
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.freecad_tests.outcome }}" != "success" ]]; then
            echo "NextCAD native application checks ran, but the FreeCAD test suite failed."
            exit 1
          fi

  next-bim:
    name: Next BIM / ${{ matrix.os }}
    needs: source-preparation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: ubuntu-22.04 }
          - { os: Windows, runner: windows-latest }
          - { os: macOS, runner: macos-15 }
    steps:
      - name: Checkout all upstream sources
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Prepare only the pinned Next BIM source tree
        shell: bash
        run: |
          bash scripts/apply-source-patches.sh --only nextbim

      - name: Linux graphics development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install stable Rust and test components
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/BIMCraft -> upstream/BIMCraft/target

      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: upstream/BIMCraft
        run: cargo fmt --check

      - name: Build sample WASM plugin used by tests
        working-directory: upstream/BIMCraft
        run: cargo build --manifest-path crates/plugin/tests/sample-plugin/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Run Clippy
        working-directory: upstream/BIMCraft
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Next BIM native test suite
        id: nextbim_tests
        continue-on-error: true
        working-directory: upstream/BIMCraft
        run: cargo test --workspace

      - name: Build Next BIM desktop application and project CLI
        working-directory: upstream/BIMCraft
        run: cargo build --release -p bimcraft -p bimcraft-cli

      - name: Verify Next BIM native create-edit-save-reopen on Windows
        if: runner.os == 'Windows'
        working-directory: upstream/BIMCraft
        run: python ../../scripts/verify_nextbim_roundtrip.py --cli target/release/bimcraft-cli.exe

      - name: Verify Next BIM native create-edit-save-reopen on Unix
        if: runner.os != 'Windows'
        working-directory: upstream/BIMCraft
        run: python ../../scripts/verify_nextbim_roundtrip.py --cli target/release/bimcraft-cli

      - name: Launch Next BIM on Windows
        if: runner.os == 'Windows'
        working-directory: upstream/BIMCraft
        run: python ../../scripts/smoke_native.py --executable target/release/bimcraft.exe

      - name: Launch Next BIM on macOS
        if: runner.os == 'macOS'
        working-directory: upstream/BIMCraft
        run: python ../../scripts/smoke_native.py --executable target/release/bimcraft

      - name: Capture the real Next BIM interface
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 xvfb scrot xdotool
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -lc '
            set -euo pipefail
            cd upstream/BIMCraft
            export BIMCRAFT_NO_UPDATE_CHECK=1
            ./target/release/bimcraft > ../../artifacts/next-bim.log 2>&1 &
            app_pid=$!
            window_id=""
            for attempt in $(seq 1 60); do
              sleep 2
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "Next BIM exited before the screenshot could be captured" >&2
                cat ../../artifacts/next-bim.log
                exit 1
              fi
              window_id="$(xdotool search --onlyvisible --name "Next BIM" 2>/dev/null | head -n 1 || true)"
              if [ -n "$window_id" ]; then
                break
              fi
            done
            if [ -z "$window_id" ]; then
              echo "Next BIM did not create a visible desktop window" >&2
              cat ../../artifacts/next-bim.log
              kill "$app_pid" || true
              exit 1
            fi
            xdotool windowactivate --sync "$window_id" || true
            sleep 5
            scrot ../../artifacts/next-bim.png
            kill "$app_pid" || true
            wait "$app_pid" || true
            test -s ../../artifacts/next-bim.png
          '

      - name: Upload Next BIM GUI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: next-bim-linux-gui-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Next BIM unit-test gate after native acceptance
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.nextbim_tests.outcome }}" != "success" ]]; then
            echo "Next BIM native application checks ran, but the workspace test suite failed."
            exit 1
          fi
