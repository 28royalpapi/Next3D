name: NextAI deep-training pipeline validation

on:
  push:
    branches:
      - nextai-deep-training
    paths:
      - "training/nextai/audit_nextai_corpus.py"
      - "training/nextai/prepare_large_scale_corpus.py"
      - "training/nextai/run_large_scale_training.py"
      - "training/nextai/train_nextai.py"
      - "training/nextai/buildeng_dataset.py"
      - "training/nextai/generate_verified_engineering_cases.py"
      - "training/nextai/prepare_public_corpora.py"
      - "training/nextai/LARGE_SCALE_TRAINING_PROGRAMME.md"
      - "scripts/collect_nextcad_native_splits.py"
      - "scripts/run_nextcad_ai_acceptance.py"
      - "scripts/run_nextbim_ai_acceptance.py"
      - "scripts/collect_nextbim_native_splits.py"
      - "tests/nextai/test_large_scale_training.py"
      - "tests/next-ai/test_nextbim_native_collection.py"
      - ".github/workflows/nextai-deep-training-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run large-scale corpus audit unit tests
        run: python -m unittest tests.nextai.test_large_scale_training -v
      - name: Test native NextCAD/Next BIM SFT conversion and evidence records
        run: python -m unittest discover -s tests/next-ai -p 'test_nextbim_native_collection.py' -v
      - name: Compile training pipeline scripts
        run: |
          python - <<'PY'
          import py_compile
          files = [
              "training/nextai/audit_nextai_corpus.py",
              "training/nextai/prepare_large_scale_corpus.py",
              "training/nextai/prepare_public_corpora.py",
              "training/nextai/buildeng_dataset.py",
              "training/nextai/generate_verified_engineering_cases.py",
              "training/nextai/run_large_scale_training.py",
              "scripts/run_nextcad_ai_acceptance.py",
              "scripts/collect_nextcad_native_splits.py",
              "scripts/run_nextbim_ai_acceptance.py",
              "scripts/collect_nextbim_native_splits.py",
          ]
          for path in files:
              py_compile.compile(path, doraise=True)
          PY
      - name: Check CLI help without downloading any model
        run: |
          python training/nextai/prepare_large_scale_corpus.py --help
          python training/nextai/audit_nextai_corpus.py --help
          python training/nextai/run_large_scale_training.py --help
          python training/nextai/generate_verified_engineering_cases.py --help
          python scripts/run_nextcad_ai_acceptance.py --help
          python scripts/collect_nextcad_native_splits.py --help
          python scripts/run_nextbim_ai_acceptance.py --help
          python scripts/collect_nextbim_native_splits.py --help
