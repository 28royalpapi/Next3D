name: NextAI deep-training pipeline validation

on:
  push:
    branches:
      - nextai-deep-training
    paths:
      - "training/nextai/audit_nextai_corpus.py"
      - "training/nextai/prepare_large_scale_corpus.py"
      - "training/nextai/run_large_scale_training.py"
      - "training/nextai/train_nextai.py"
      - "training/nextai/buildeng_dataset.py"
      - "training/nextai/generate_verified_engineering_cases.py"
      - "training/nextai/prepare_public_corpora.py"
      - "training/nextai/nextai_master_curriculum.py"
      - "training/nextai/build_master_curriculum.py"
      - "training/nextai/scaled_practical_curriculum.py"
      - "training/nextai/build_scaled_practical_curriculum.py"
      - "tests/next-ai/test_scaled_practical_curriculum.py"
      - "training/nextai/operator_practical_exam_v1.json"
      - "tests/next-ai/test_master_project_curriculum.py"
      - "tests/next-ai/test_operator_practical_exam_v1.py"
      - "training/nextai/LARGE_SCALE_TRAINING_PROGRAMME.md"
      - "training/nextai/engineering_benchmark_v1.py"
      - "training/nextai/run_engineering_benchmark.py"
      - "scripts/collect_nextcad_native_splits.py"
      - "scripts/run_nextcad_ai_acceptance.py"
      - "scripts/run_nextbim_ai_acceptance.py"
      - "scripts/collect_nextbim_native_splits.py"
      - "tests/nextai/test_large_scale_training.py"
      - "tests/next-ai/test_expanded_engineering_cases.py"
      - "tests/next-ai/test_engineering_benchmark.py"
      - "tests/next-ai/test_nextbim_native_collection.py"
      - "tests/next-ai/test_nextbim_split_validation.py"
      - "tests/next-ai/test_collect_nextcad_native_splits.py"
      - "tests/next-ai/test_native_runner_import_context.py"
      - ".github/workflows/nextai-deep-training-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run large-scale corpus audit unit tests
        run: python -m unittest tests.nextai.test_large_scale_training -v
      - name: Test native NextCAD/Next BIM SFT conversion and evidence records
        run: python -m unittest discover -s tests/next-ai -p 'test_nextbim_native_collection.py' -v
      - name: Test expanded analytic engineering curriculum
        run: python -m unittest discover -s tests/next-ai -p 'test_expanded_engineering_cases.py' -v
      - name: Test independent held-out engineering benchmark
        run: python -m unittest discover -s tests/next-ai -p 'test_engineering_benchmark.py' -v
      - name: Test Next BIM train/validation/test isolation gates
        run: python -m unittest discover -s tests/next-ai -p 'test_nextbim_split_validation.py' -v
      - name: Test NextCAD native split lineage and state fingerprints
        run: python -m unittest discover -s tests/next-ai -p 'test_collect_nextcad_native_splits.py' -v
      - name: Test master project/operator curriculum and held-out practical exam
        run: |
          python -m unittest discover -s tests/next-ai -p 'test_master_project_curriculum.py' -v
          python -m unittest discover -s tests/next-ai -p 'test_operator_practical_exam_v1.py' -v
      - name: Test 100,000-example practical curriculum scale and split integrity
        run: python -m unittest discover -s tests/next-ai -p 'test_scaled_practical_curriculum.py' -v
      - name: Materialize and verify 620 authored master curriculum examples
        run: python training/nextai/build_master_curriculum.py --output-dir "$RUNNER_TEMP/nextai-master-curriculum"
      - name: Upload exact master curriculum splits and manifest
        uses: actions/upload-artifact@v4
        with:
          name: nextai-master-curriculum-v2
          path: ${{ runner.temp }}/nextai-master-curriculum/
          if-no-files-found: error
          retention-days: 30
      - name: Materialize 100,000 practical curriculum examples and audit all splits
        run: python training/nextai/build_scaled_practical_curriculum.py --output-dir "$RUNNER_TEMP/nextai-scaled-practical-curriculum"
      - name: Upload 100,000 practical curriculum splits and manifest
        uses: actions/upload-artifact@v4
        with:
          name: nextai-scaled-practical-curriculum-v1
          path: ${{ runner.temp }}/nextai-scaled-practical-curriculum/
          if-no-files-found: error
          retention-days: 30
      - name: Test Next BIM native runner from submodule working directory
        run: python -m unittest discover -s tests/next-ai -p 'test_native_runner_import_context.py' -v
      - name: Compile training pipeline scripts
        run: |
          python - <<'PY'
          import py_compile
          files = [
              "training/nextai/audit_nextai_corpus.py",
              "training/nextai/prepare_large_scale_corpus.py",
              "training/nextai/prepare_public_corpora.py",
              "training/nextai/nextai_master_curriculum.py",
              "training/nextai/build_master_curriculum.py",
              "training/nextai/scaled_practical_curriculum.py",
              "training/nextai/build_scaled_practical_curriculum.py",
              "training/nextai/buildeng_dataset.py",
              "training/nextai/generate_verified_engineering_cases.py",
              "training/nextai/run_large_scale_training.py",
              "scripts/run_nextcad_ai_acceptance.py",
              "scripts/collect_nextcad_native_splits.py",
              "scripts/run_nextbim_ai_acceptance.py",
              "scripts/collect_nextbim_native_splits.py",
          ]
          for path in files:
              py_compile.compile(path, doraise=True)
          PY
      - name: Check CLI help without downloading any model
        run: |
          python training/nextai/prepare_large_scale_corpus.py --help
          python training/nextai/audit_nextai_corpus.py --help
          python training/nextai/run_large_scale_training.py --help
          python training/nextai/generate_verified_engineering_cases.py --help
          python training/nextai/build_master_curriculum.py --help
          python training/nextai/build_scaled_practical_curriculum.py --help
          python scripts/run_nextcad_ai_acceptance.py --help
          python scripts/collect_nextcad_native_splits.py --help
          python scripts/run_nextbim_ai_acceptance.py --help
          python scripts/collect_nextbim_native_splits.py --help
